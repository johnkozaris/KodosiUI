name: Linux CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/linux-support
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodosi-qt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Qt 6.11 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        working-directory: KodosiQT

    steps:
      - name: Check out KodosiQT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: KodosiQT
          persist-credentials: false

      - name: Check out pinned Rust runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: johnkozaris/Kodosi
          ref: 698fe24f3c5137904128085a786a1ce777c6e153
          token: ${{ secrets.KODOSI_REPOSITORY_TOKEN }}
          path: Kodosi
          persist-credentials: false

      - name: Check out pinned Swift parity baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: johnkozaris/kodosiSwift
          ref: 5862580428b5219675c36e6e5c1cf875e94eedac
          token: ${{ secrets.KODOSI_REPOSITORY_TOKEN }}
          path: kodosiSwift
          persist-credentials: false

      - name: Check out pinned Ghostty package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: johnkozaris/kodosi-ghostty
          ref: 77ebed9ed18de493296c5d4c2afc39b1d6d52e40
          token: ${{ secrets.KODOSI_REPOSITORY_TOKEN }}
          path: kodosi-ghostty
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Qt runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            desktop-file-utils \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libgl-dev \
            patchelf \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0

      - name: Install pinned just
        env:
          JUST_VERSION: "1.58.0"
          JUST_SHA256: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"
        run: |
          archive="$RUNNER_TEMP/just.tar.gz"
          bin_dir="$RUNNER_TEMP/just-bin"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" just
          "$bin_dir/just" --version | grep --fixed-strings "just $JUST_VERSION"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Validate parity, build, lint, and test
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: just check

      - name: Build Linux packages
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: just package

      - name: Validate X11 and Wayland packages
        run: ./scripts/verify-linux-desktops.sh

      - name: Build and install Manjaro package
        run: ./scripts/build-manjaro-package.sh
